services:
  postgres:
    image: postgres:16-alpine
    container_name: storytime_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: storytime
      POSTGRES_PASSWORD: storytime_secret
      POSTGRES_DB: storytime_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storytime -d storytime_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storytime_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: redispassword123
    # The official redis image ignores REDIS_PASSWORD; it must be enforced via
    # --requirepass. Keep this in sync with the password in REDIS_URL (.env).
    command: ['sh', '-c', 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
