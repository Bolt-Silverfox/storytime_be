# `nest build` (tsc compile) after generating the Prisma client; the GitHub
# "Build" job. Status check: ci/woodpecker/{push,pr}/build
#
# HEAVY lane. The GitHub job also started a postgres:16-alpine service, but
# neither `prisma generate` nor `nest build` connects to a database, so it is
# dropped here (one less container on a shared 8 GB agent).
# PRs run once (as pull_request); pushes run only on the long-lived branches,
# where there is no PR to cover them. Halves spot usage per PR commit.
when:
  - event: pull_request
  - event: push
    branch: [main, "develop-v*", "release-v*"]

labels:
  lane: heavy

variables:
  - &node_image node:24.22.1-bookworm
  - &pnpm "corepack enable && corepack prepare pnpm@10.15.1 --activate"
  # The pnpm store goes beside the checkout, on the same workspace volume
  # (/woodpecker is the Docker backend's workspace base), so installs can
  # hardlink and the store is shared by the workflow's steps. Left to default,
  # pnpm would create .pnpm-store INSIDE the checkout (the step's home is on
  # another filesystem), where a bare `eslint` would lint it.
  - &corepack_env
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    npm_config_store_dir: /woodpecker/.pnpm-store

steps:
  - name: install
    image: *node_image
    environment: *corepack_env
    commands:
      - *pnpm
      - pnpm install --frozen-lockfile --ignore-scripts

  - name: generate
    image: *node_image
    environment: *corepack_env
    commands:
      - *pnpm
      - pnpm db:generate

  - name: build
    image: *node_image
    environment:
      <<: *corepack_env
      NODE_OPTIONS: --max-old-space-size=2048
    commands:
      - *pnpm
      - pnpm build
