# Dependency audit, blocking on high and critical advisories, as the GitHub
# "Security audit" step in Code Quality was meant to be. Status check:
# ci/woodpecker/{push,pr}/security
#
# NOTE for the reviewer: the GitHub workflows actually ran this step as
# advisory (`continue-on-error` / `|| true`), because a newly published CVE in
# a transitive dependency blocks every branch with no change on our side. It is
# blocking here on request. If that bites, add `|| true` to the command: the
# context stays but cannot fail.
#
# LIGHT lane: `pnpm audit` reads only package.json + pnpm-lock.yaml, so there
# is no install and the step is tiny.
# PRs run once (as pull_request); pushes run only on the long-lived branches.
when:
  - event: pull_request
  - event: push
    branch: [main, "develop-v*", "release-v*"]

labels:
  lane: light

steps:
  - name: audit
    image: node:24.22.1-bookworm
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NODE_OPTIONS: --max-old-space-size=384
    commands:
      - corepack enable && corepack prepare pnpm@10.15.1 --activate
      - pnpm audit --audit-level=high
