name: Blue Deploy (develop-v1.3.0)

# Deploys the v1.3.0 "blue" candidate to blue.dev.api.storytimeapp.me, which
# runs on the SAME host as green (dev) but a separate port (:3601), directory,
# database (storytime_db_blue), and Redis logical DB (/3). Green
# (develop-v1.2.0 -> dev.api) is never touched.
#
# Reuses the existing EC2_* secrets and the green ENV_FILE secret — blue's .env
# is derived from ENV_FILE with PORT/DATABASE_URL/REDIS_URL overridden below, and
# the blue database is created on first deploy. No extra secret required.
# Auto-deploys blue on every push/merge to develop-v1.3.0. Blue infra (derived
# .env, storytime_db_blue, nginx block, PM2 app on :3601) is in place, so the
# push trigger is enabled. workflow_dispatch is kept for manual re-runs (note:
# it only registers on GitHub once this file reaches the default branch; the
# push trigger works from develop-v1.3.0 directly).
on:
  workflow_dispatch:
  push:
    branches: ['develop-v1.3.0']

concurrency:
  group: blue-deploy
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy-blue:
    name: Deploy Blue
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The EC2_HOST/EC2_USERNAME/EC2_SSH_KEY (and green's ENV_FILE) secrets live
    # at the `development` environment level, not the repo level — same as green's
    # deploy job. Without this, those secrets resolve empty and the SSH steps fail.
    environment:
      name: development
      url: https://blue.dev.api.storytimeapp.me
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Build blue .env from green env (isolation overrides)
        env:
          # Grafana Cloud write token (OTLP) — kept out of ENV_FILE so it can
          # rotate independently; injected here so blue keeps pushing telemetry
          # after a redeploy (green's ENV_FILE carries no Grafana vars).
          GRAFANA_CLOUD_API_TOKEN: ${{ secrets.GRAFANA_CLOUD_API_TOKEN }}
        run: |
          # Reuse green's env (API keys etc.) and override only the vars that
          # must differ so blue can't touch green's data on the shared host.
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF
          # PORT -> 3601
          sed -i '/^PORT=/d' .env; echo 'PORT=3601' >> .env
          # DATABASE_URL -> the blue database (keep host/creds/query params)
          sed -i -E 's#(^DATABASE_URL="?[^/]*//[^/]+/)[^?"]+#\1storytime_db_blue#' .env
          # REDIS_URL -> logical DB /3 (green uses its own index)
          sed -i -E 's#(^REDIS_URL="?[^/]*//[^/]*:[0-9]+)(/[0-9]+)?#\1/3#' .env
          # cap the Prisma pool so blue can't starve the shared RDS (green + others)
          sed -i -E 's/connection_limit=[0-9]+/connection_limit=10/' .env
          # Grafana Cloud OTLP push (BLUE ONLY — green/dev intentionally omits it).
          # Strip any inherited OTEL/Grafana lines, then append blue's config so a
          # redeploy re-establishes the push instead of silently dropping telemetry.
          sed -i -E '/^(OTEL_EXPORTER_OTLP_ENDPOINT|OTEL_EXPORTER_LOGS_ENDPOINT|OTEL_EXPORTER_METRICS_ENDPOINT|OTEL_METRICS_EXPORTER|OTEL_SERVICE_NAME|GRAFANA_CLOUD_INSTANCE_ID|GRAFANA_CLOUD_API_TOKEN)=/d' .env
          cat >> .env << 'EOF'
          OTEL_EXPORTER_OTLP_ENDPOINT=https://otlp-gateway-prod-gb-south-1.grafana.net/otlp/v1/traces
          OTEL_EXPORTER_LOGS_ENDPOINT=https://otlp-gateway-prod-gb-south-1.grafana.net/otlp/v1/logs
          OTEL_EXPORTER_METRICS_ENDPOINT=https://otlp-gateway-prod-gb-south-1.grafana.net/otlp/v1/metrics
          OTEL_METRICS_EXPORTER=otlp
          OTEL_SERVICE_NAME=storytime-api-blue
          GRAFANA_CLOUD_INSTANCE_ID=1730856
          EOF
          # token comes from the step env (never a workflow literal)
          printf 'GRAFANA_CLOUD_API_TOKEN=%s\n' "$GRAFANA_CLOUD_API_TOKEN" >> .env
          echo "Blue env overrides applied:"; grep -E '^(PORT|DATABASE_URL|REDIS_URL|OTEL_SERVICE_NAME|GRAFANA_CLOUD_INSTANCE_ID)=' .env | sed -E 's/(:)[^:@]*(@)/\1***\2/'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (validate before shipping)
        run: pnpm db:generate && pnpm build

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Add server host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" > /tmp/known_hosts
          chmod 600 /tmp/known_hosts

      - name: Prepare blue directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/storytime/blue/storytime-api

      - name: Sync files to blue directory
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env.local' \
            --exclude='coverage' \
            --exclude='.turbo' \
            -e "ssh -i /tmp/ssh_key -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/storytime/blue/storytime-api/

      - name: Install + migrate + (re)start blue
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            source ~/.nvm/nvm.sh
            cd /home/ubuntu/storytime/blue/storytime-api

            pnpm install --frozen-lockfile

            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv
            cd scripts
            python3 -m venv .venv
            .venv/bin/pip install -q -r requirements.txt
            cd ..

            # Ensure the blue database exists (deploy:blue's migrations need it).
            # Connects to the 'postgres' maintenance DB with the same creds.
            DB_URL="$(grep -E '^DATABASE_URL=' .env | head -1 | sed -E 's/^DATABASE_URL=//; s/^"//; s/"$//')"
            ADMIN_URL="$(echo "$DB_URL" | sed -E 's#/[^/?]+(\?|$)#/postgres\1#')"
            psql "$ADMIN_URL" -tAc "SELECT 1 FROM pg_database WHERE datname='storytime_db_blue'" | grep -q 1 \
              || psql "$ADMIN_URL" -c 'CREATE DATABASE storytime_db_blue'

            # Migrate the schema first, then seed the blue catalog (parity with
            # green's deploy, which seeds every run). Seeding is idempotent —
            # stories skip existing titles, categories/themes use skipDuplicates,
            # the rest upsert — so re-running never duplicates. Seed BEFORE the
            # app (re)starts so a fresh blue DB serves data from first boot.
            pnpm db:migrate:deploy
            pnpm db:seed

            # generate client + (re)start blue PM2 app on :3601. deploy:blue also
            # runs db:migrate:deploy again — a harmless no-op the second time.
            pnpm deploy:blue

      - name: Verify blue deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Poll health for up to ~60s. A single check after a fixed sleep
            # false-fails when the app boots slowly (seeding + fresh start can
            # push first-response past 10s), even though blue comes up fine.
            for i in $(seq 1 20); do
              if curl -sf http://localhost:3601/api/v1/health >/dev/null 2>&1; then
                echo "Blue deployment verified on :3601 (attempt $i)"
                exit 0
              fi
              echo "health not ready yet (attempt $i/20), retrying in 3s..."
              sleep 3
            done
            echo "Blue health check failed after ~60s"
            exit 1
