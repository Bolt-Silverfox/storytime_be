# Quality, build and test gate for pull requests into `main`.
#
# This file used to also deploy production: on a PR merged into `main` it ran
# Prisma migrate/seed from the runner, rsynced the tree over SSH to
# `secrets.EC2_HOST` and restarted PM2 there via appleboy/ssh-action. That host
# no longer serves production — the API now runs as a container on a single EC2
# box, reconciled over SSM — so the job could only fail. It has been removed,
# along with the `rsync --delete` that would mirror the repo tree over a live
# deployment path if `EC2_HOST` were ever repointed at the current box.
#
# Production deploys are to be made by `deploy-production.yml`, a manual
# (`workflow_dispatch`) caller of the shared storytime-devops pipeline. That
# file is not merged yet — it is open as PR #599 — and it also needs a
# Dockerfile on `main`, the deploy roles applied, and a copy on the default
# branch before `workflow_dispatch` will register it. So there is no automated
# production deploy path in the interim; the running containers are unaffected.
#
# NOTE: the shared pipeline does NOT run Prisma. Removing this job therefore
# removes the only automated production `migrate deploy` and `db:seed`; per
# storytime-devops `docs/build-and-deploy.md`, migrations are run by hand on
# the box (`docker exec storytime-api node_modules/.bin/prisma migrate deploy`)
# and production seeding has no automated owner.
#
# The quality, build and test jobs below are unchanged and still run on every
# pull request into `main` (`Build` is the required status check).
name: Production CI

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

concurrency:
  group: prod-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  # ===================
  # Quality Checks (runs on all events)
  # ===================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

      - name: Security audit
        continue-on-error: true
        run: pnpm audit --audit-level=high

  # ===================
  # Build (runs on all events)
  # ===================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storytime_build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storytime_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            node_modules/.prisma/
          retention-days: 1

      - name: Cleanup sensitive files
        if: always()
        run: rm -f .env

  # ===================
  # Test (runs on all events)
  # ===================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storytime_test
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storytime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create synthetic .env (no real secrets in pre-merge CI)
        run: |
          cat > .env << 'EOF'
          NODE_ENV=development
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/storytime_test
          REDIS_URL=redis://localhost:6379
          ELEVEN_LABS_KEY=ci-dummy
          CLOUDINARY_CLOUD_NAME=ci-dummy
          CLOUDINARY_API_KEY=ci-dummy
          CLOUDINARY_API_SECRET=ci-dummy
          DEFAULT_SENDER_EMAIL=ci@example.com
          DEFAULT_SENDER_NAME=CI
          SMTP_HOST=localhost
          SMTP_USER=ci@example.com
          SMTP_PASS=ci-dummy
          JWT_SECRET=ci-dummy-not-a-secret
          ADMIN_SECRET=ci-dummy-not-a-secret
          SECRET=ci-dummy-not-a-secret
          WEB_APP_BASE_URL=http://localhost:3000
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy
          GOOGLE_WEB_CLIENT_ID=ci-dummy
          GOOGLE_ANDROID_CLIENT_ID=ci-dummy
          GOOGLE_IOS_CLIENT_ID=ci-dummy
          BACKEND_BASE_URL=http://localhost:3000
          DEEPGRAM_API_KEY=ci-dummy
          APPLE_CLIENT_ID=ci-dummy
          APPLE_SERVICE_ID=ci-dummy
          GEMINI_API_KEY=ci-dummy
          HF_TOKEN=ci-dummy
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Run tests
        run: pnpm test

      - name: Cleanup sensitive files
        if: always()
        run: rm -f .env
