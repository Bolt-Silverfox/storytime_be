name: Dev CI/CD Pipeline

on:
  # Manual trigger for a controlled first cutover deploy (run it after taking
  # the storytime_dev RDS snapshot) and for ad-hoc redeploys.
  workflow_dispatch:
  pull_request:
    branches: ['develop-v*']
    types: [opened, synchronize, closed]

concurrency:
  group: dev-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

permissions:
  contents: read

jobs:
  # ===================
  # Quality Checks (runs on all events)
  # ===================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443
            productionresultssa1.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            binaries.prisma.sh:443
            checkpoint.prisma.io:443
            52.18.195.224:22
            emerj-shared-db.cvq22s4q62o3.eu-west-1.rds.amazonaws.com:5432

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Format check
        continue-on-error: true
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint
        continue-on-error: true
        run: pnpm run lint

      - name: Security audit
        continue-on-error: true
        run: pnpm audit --audit-level=high || true

  # ===================
  # Build (runs on all events)
  # ===================
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: development
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storytime_build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storytime_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443
            productionresultssa1.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            binaries.prisma.sh:443
            checkpoint.prisma.io:443
            52.18.195.224:22
            emerj-shared-db.cvq22s4q62o3.eu-west-1.rds.amazonaws.com:5432

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            node_modules/.prisma/
          retention-days: 1

  # ===================
  # Test (runs on all events)
  # ===================
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: development
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storytime_test
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storytime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443
            productionresultssa1.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            binaries.prisma.sh:443
            checkpoint.prisma.io:443
            52.18.195.224:22
            emerj-shared-db.cvq22s4q62o3.eu-west-1.rds.amazonaws.com:5432

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create synthetic .env (no real secrets in pre-merge CI)
        run: |
          cat > .env << 'EOF'
          NODE_ENV=development
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/storytime_test
          REDIS_URL=redis://localhost:6379
          ELEVEN_LABS_KEY=ci-dummy
          CLOUDINARY_CLOUD_NAME=ci-dummy
          CLOUDINARY_API_KEY=ci-dummy
          CLOUDINARY_API_SECRET=ci-dummy
          DEFAULT_SENDER_EMAIL=ci@example.com
          DEFAULT_SENDER_NAME=CI
          SMTP_HOST=localhost
          SMTP_USER=ci@example.com
          SMTP_PASS=ci-dummy
          JWT_SECRET=ci-dummy-not-a-secret
          ADMIN_SECRET=ci-dummy-not-a-secret
          SECRET=ci-dummy-not-a-secret
          WEB_APP_BASE_URL=http://localhost:3000
          GOOGLE_CLIENT_ID=ci-dummy
          GOOGLE_CLIENT_SECRET=ci-dummy
          GOOGLE_WEB_CLIENT_ID=ci-dummy
          GOOGLE_ANDROID_CLIENT_ID=ci-dummy
          GOOGLE_IOS_CLIENT_ID=ci-dummy
          BACKEND_BASE_URL=http://localhost:3000
          DEEPGRAM_API_KEY=ci-dummy
          APPLE_CLIENT_ID=ci-dummy
          APPLE_SERVICE_ID=ci-dummy
          GEMINI_API_KEY=ci-dummy
          HF_TOKEN=ci-dummy
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Run tests with coverage
        continue-on-error: true
        run: pnpm test --coverage

      # No Codecov upload here on purpose: this job runs untrusted pull-request
      # test code, so CODECOV_TOKEN must not be present on the runner (a test
      # could persist a process and read a later step's env — CWE-522). If
      # coverage reporting is wanted, add a SEPARATE post-merge job that runs
      # tests and uploads with the token, isolated from PR code.

      - name: Cleanup sensitive files
        if: always()
        run: rm -f .env
  # ===================
  # Deploy to Development (only on merge, requires build/test success)
  # ===================
  deploy:
    name: Deploy to Dev
    needs: [build, test]
    # Base-branch gate: CI jobs above run for PRs to any develop-v* branch, but
    # only merges into develop-v1.3.0 (now the default/primary line) deploy the
    # shared dev environment (dev.api / storytime_dev). Green (develop-v1.2.0) is
    # being retired and no longer deploys dev, so storytime_dev keeps a SINGLE
    # writer. workflow_dispatch allows a controlled first cutover deploy (run it
    # after taking the storytime_dev RDS snapshot).
    if: >-
      success() &&
      ( github.event_name == 'workflow_dispatch' ||
        ( github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          github.event.pull_request.base.ref == 'develop-v1.3.0' ) )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: development
      url: ${{ vars.DEV_APP_URL }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            codeload.github.com:443
            productionresultssa1.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            binaries.prisma.sh:443
            checkpoint.prisma.io:443
            52.18.195.224:22
            emerj-shared-db.cvq22s4q62o3.eu-west-1.rds.amazonaws.com:5432

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build application
        run: pnpm db:generate && pnpm build

      - name: Run database migrations
        run: pnpm db:migrate:deploy

      - name: Seed database
        run: pnpm db:seed

      - name: Prepare deployment directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/storytime/development/storytime-api

      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/ssh_key
          chmod 600 /tmp/ssh_key

      - name: Add server host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -H "$EC2_HOST" > /tmp/known_hosts
          chmod 600 /tmp/known_hosts

      - name: Sync files to server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env.local' \
            --exclude='coverage' \
            --exclude='.turbo' \
            -e "ssh -i /tmp/ssh_key -o UserKnownHostsFile=/tmp/known_hosts -o StrictHostKeyChecking=yes" \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/home/ubuntu/storytime/development/storytime-api/

      - name: Install dependencies and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            source ~/.nvm/nvm.sh
            cd /home/ubuntu/storytime/development/storytime-api

            # Install Node dependencies
            pnpm install --frozen-lockfile

            # Ensure python3-venv is available (required for venv creation)
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv

            # Setup Python virtual environment for scripts
            cd scripts
            python3 -m venv .venv
            .venv/bin/pip install -q -r requirements.txt
            cd ..

            # Restart application
            pnpm deploy:dev

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Verify the app starts AND *stays* healthy. A single probe 10s
            # after restart false-failed successful deploys (cold start takes
            # ~16s), and checking only a final probe would pass a crash-loop
            # that happens to be up at second 60 — so require a sustained
            # healthy streak (>=3 = ~15s) at the end of a ~60s window.
            start_time=$(date +%s)
            deadline=$((start_time + 60))
            streak=0
            for i in $(seq 1 12); do
              # Wait-then-probe so probes land at t=5..60: the END of the
              # window is observed, and a crash in the final seconds resets
              # the streak instead of slipping through unprobed.
              target=$((start_time + i * 5))
              now=$(date +%s)
              delay=$((target - now))
              [ "$delay" -le 0 ] || sleep "$delay"

              now=$(date +%s)
              remaining=$((deadline - now))
              # The final probe lands at the deadline; keep it bounded
              # (>=5s budget) rather than skipping it.
              [ "$remaining" -ge 5 ] || remaining=5
              if curl -fsS --connect-timeout 5 --max-time "$remaining" \
                http://localhost:3500/api/v1/health > /dev/null; then
                streak=$((streak + 1))
              else
                streak=0
              fi
            done
            if [ "$streak" -lt 3 ]; then
              echo "App not consistently healthy at end of 60s window (streak=$streak) - possible crash-loop"; exit 1
            fi

            echo "Deployment verified successfully"

      - name: Comment deployment status
        if: success() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Deployed to Development**\n\nCommit: \`${context.sha.substring(0, 7)}\`\nTime: ${new Date().toISOString()}`
            });

      - name: Comment deployment failure
        if: failure() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Deployment to Development Failed**\n\nCommit: \`${context.sha.substring(0, 7)}\`\nCheck the [workflow logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
            });

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f /tmp/ssh_key /tmp/known_hosts
          rm -f .env
