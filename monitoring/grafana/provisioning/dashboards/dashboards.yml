# Grafana dashboard provisioning — auto-loads JSON dashboards from disk.
apiVersion: 1
providers:
  - name: storytime
    orgId: 1
    folder: Storytime
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      # Mount monitoring/grafana/dashboards here in your Grafana container
      path: /etc/grafana/provisioning/dashboards/storytime
