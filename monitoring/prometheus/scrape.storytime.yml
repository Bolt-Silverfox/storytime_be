# Prometheus scrape config for the Storytime API's OpenTelemetry Prometheus
# exporter. Merge this job into your prometheus.yml `scrape_configs:`.
# The app serves metrics at http://<host>:${PROMETHEUS_PORT:-9464}/metrics
# and binds 127.0.0.1 by default. A Prometheus in another container or host needs
# OTEL_EXPORTER_PROMETHEUS_HOST=0.0.0.0 on the app (port 9464 must stay private).
- job_name: storytime-api
  metrics_path: /metrics
  scrape_interval: 15s
  static_configs:
    - targets: ['storytime-api:9464']
      labels:
        service: storytime-api
