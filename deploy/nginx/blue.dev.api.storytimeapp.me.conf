# Blue backend — blue.dev.api.storytimeapp.me -> storytime-api-blue (127.0.0.1:3600)
# Runs ALONGSIDE green (dev.api.storytimeapp.me -> :3500) on the same host.
#
# Install:
#   sudo cp deploy/nginx/blue.dev.api.storytimeapp.me.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/blue.dev.api.storytimeapp.me.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (certbot rewrites this file to add the :443 server + http->https redirect):
#   sudo certbot --nginx -d blue.dev.api.storytimeapp.me

upstream storytime_blue_backend {
    server 127.0.0.1:3600 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name blue.dev.api.storytimeapp.me;

    client_max_body_size 25m;   # audio/image uploads

    location / {
        proxy_pass http://storytime_blue_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # SSE endpoints (/api/v1/events, /api/v1/admin/sse) need buffering off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
